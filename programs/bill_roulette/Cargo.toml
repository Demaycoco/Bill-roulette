[package]
name = "bill-roulette"
version = "0.1.0"
description = "Solana Anchor smart contract for Bill Roulette on Solana Devnet with MagicBlock VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bill_roulette"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "~1.18"
thiserror = "1.0"
# MagicBlock Solana VRF (compatible with Anchor 0.30 and Solana 1.18)
# Repository: https://github.com/magicblock-labs/solana-vrf
# ephemeral-rollups-sdk = { version = "0.1", features = ["anchor", "vrf"], optional = true }

